name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Check tag identity
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - run: npm run check
        env:
          BRIDGE_CLAUDE: /nonexistent/unit-test-must-not-start-claude
      - run: npm run bundle -- --check
      - run: npm run test:distribution
      - name: Check final artifacts
        timeout-minutes: 5
        run: node scripts/check-artifacts.mjs
      # Upload only the exact checked files, confirmed unchanged in this same step;
      # a failed check, missing record or changed byte stops before the release.
      - name: Create a reviewable draft from the checked artifacts
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-artifacts.mjs --verify > "$RUNNER_TEMP/checked-artifacts"
          files=()
          while IFS= read -r file; do files+=("$file"); done < "$RUNNER_TEMP/checked-artifacts"
          test "${#files[@]}" -eq 4
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --draft --prerelease --generate-notes
